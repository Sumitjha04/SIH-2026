name: freebuff_app
description: "AI-Based Cognitive Gaming & Memory Assistance Platform for NER"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management
  provider: ^6.1.2
  # Local storage
  shared_preferences: ^2.3.3
  # Charts
  fl_chart: ^0.70.2
  # Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  # UUID
  uuid: ^4.5.1
  # Path provider
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
